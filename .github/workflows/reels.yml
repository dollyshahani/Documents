# Renders reels Claude scripted in Dolly OS → uploads → pings the app for approval.
# Runs hourly, and instantly when Dolly OS dispatches it ("new reel" / "redo").
name: reels

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dolly-os-app/content-engine
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: python render.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VOICE: ${{ vars.REEL_VOICE || 'en-IN-NeerjaNeural' }}
